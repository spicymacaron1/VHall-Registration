<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COSMIC SCOPE // Deep Space Lucky Draw Engine</title>

  <!-- External Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            orbitron: ['Orbitron', 'sans-serif'],
            rajdhani: ['Rajdhani', 'sans-serif'],
            mono: ['Share Tech Mono', 'monospace'],
          },
          colors: {
            space: {
              black: '#020208',
              dark: '#070a16',
              cyan: '#00f0ff',
              gold: '#ffd700',
              purple: '#b026ff',
              magenta: '#ff007f'
            }
          },
          boxShadow: {
            'glow-cyan': '0 0 30px rgba(0, 240, 255, 0.6), inset 0 0 20px rgba(0, 240, 255, 0.3)',
            'glow-gold': '0 0 45px rgba(255, 215, 0, 0.8), inset 0 0 25px rgba(255, 215, 0, 0.4)',
          }
        }
      }
    }
  </script>

  <style>
    html, body {
      background-color: #020208;
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden !important;
      user-select: none;
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(7, 10, 22, 0.8);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.35);
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.5);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 240, 255, 0.65);
    }

    .glass-panel {
      background: rgba(8, 12, 28, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .glass-panel-gold {
      background: rgba(28, 22, 8, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 215, 0, 0.5);
    }

    #perspective-scene {
      perspective: 1400px;
      perspective-origin: 50% 50%;
    }

    #telescope-rig {
      transition: transform 1.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.4s ease, filter 1.2s ease;
      transform-style: preserve-3d;
      transform-origin: 50% 50%;
    }

    .telescope-centered {
      transform: translate3d(0px, 0px, 0px) scale(1);
      opacity: 1;
      filter: blur(0px);
    }

    .telescope-exited {
      transform: translate3d(0px, 130vh, -150px) scale(0.75);
      opacity: 0;
      filter: blur(10px);
      pointer-events: none;
    }

    #sky-winner-container {
      transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.6s ease, filter 1.6s ease;
      transform-style: preserve-3d;
      transform-origin: 50% 20%;
    }

    .sky-winner-hidden {
      opacity: 0;
      filter: blur(30px) brightness(0.2);
      transform: translate3d(0px, -150px, -300px) rotateX(35deg) scale(0.7);
      pointer-events: none;
    }

    .sky-winner-visible {
      opacity: 1;
      filter: blur(0px) brightness(1.2);
      transform: translate3d(0px, 20px, 80px) rotateX(16deg) scale(1);
    }

    @keyframes hud-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-hud-spin {
      animation: hud-rotate 28s linear infinite;
    }

    .animate-hud-reverse {
      animation: hud-rotate 20s linear infinite reverse;
    }

    .brass-bezel {
      background: linear-gradient(135deg, #b45309 0%, #fef08a 35%, #d97706 65%, #451a03 100%);
      box-shadow: 0 0 45px rgba(245, 158, 11, 0.7);
    }

    .cyan-rim-ring {
      background: linear-gradient(135deg, #0284c7 0%, #e0f2fe 40%, #0369a1 70%, #0c4a6e 100%);
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.8);
    }

    .scanlines::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.2;
    }
  </style>
</head>

  <script>
    const SUPABASE_URL = "https://qtnsdfhoyihzzspuridn.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0bnNkZmhveWloenpzcHVyaWRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzM4MjgsImV4cCI6MjEwNjg0OTgyOH0.MEXk09GChxMK6W1QZcP87c4QxsxN7Pexys4MXEoOyBs";
    const supabaseClient = window.supabase ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let state = {
      participants: [],
      winners: [],
      isDrawing: false,
      removeWinnerAfterDraw: true,
      audioEnabled: true,
      isWinnerDrawerPinned: false
    };

    let audioCtx = null;
    let stars = [];
    let shootingStars = [];
    let hugeShootingStar = null;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function saveEntries() {
      try {
        localStorage.setItem('cosmic_participants', JSON.stringify(state.participants));
      } catch (e) {}
    }

    async function syncCloudParticipants() {
      try {
        if (!supabaseClient) {
          showToast("SUPABASE CLIENT NOT LOADED", "warning");
          return;
        }
        showToast("SYNCING WITH CLOUD DATABASE...");
        const { data, error } = await supabaseClient
          .from('guests')
          .select('*')
          .order('id', { ascending: true });

        if (error) throw error;

        if (data && data.length > 0) {
          state.participants = data.map((g, idx) => ({
            name: g.name || g.guest_name || 'Explorer',
            ticket: g.ticket || g.ticket_number || `TICKET #${1000 + (g.id || idx + 1)}`,
            id: g.id || idx + 1
          }));
          saveEntries();
          renderManageTable();
          updateBadgeCounts();
          populateScrollTrack();
          showToast(`SYNCED ${data.length} GUESTS FROM CLOUD!`);
        } else {
          showToast("NO GUESTS FOUND IN CLOUD DATABASE", "warning");
        }
      } catch (e) {
        console.error(e);
        showToast("CLOUD SYNC FAILED. USING LOCAL POOL.", "warning");
      }
    }

    async function loadSavedEntries() {
      try {
        if (supabaseClient) {
          const { data, error } = await supabaseClient
            .from('guests')
            .select('*');
          if (!error && data && data.length > 0) {
            state.participants = data.map((g, idx) => ({
              name: g.name || g.guest_name || 'Explorer',
              ticket: g.ticket || g.ticket_number || `TICKET #${1000 + (g.id || idx + 1)}`,
              id: g.id || idx + 1
            }));
            saveEntries();
            return;
          }
        }

        const saved = localStorage.getItem('cosmic_participants');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            state.participants = parsed;
            return;
          }
        }
        loadSampleEntries(200);
      } catch (e) {
        loadSampleEntries(200);
      }
    }

          await syncCloudParticipants();
        } else {

    function initAudioContext() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}
    }

    function toggleAudio() {
      state.audioEnabled = !state.audioEnabled;
      const icon = document.getElementById('sound-icon');
      if (icon) {
        icon.className = state.audioEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
      }
      showToast(`AUDIO EFFECTS: ${state.audioEnabled ? 'ENABLED' : 'DISABLED'}`);
    }

    function playBeep(freq = 440, type = 'sine', duration = 0.05, vol = 0.05) {
      if (!state.audioEnabled) return;
      try {
        initAudioContext();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playSpinDrumRollLoop(durationSec = 6.5) {
      if (!state.audioEnabled) return;
      try {
        initAudioContext();
        if (!audioCtx) return;

        const startTime = audioCtx.currentTime;
        const endTime = startTime + durationSec;
        let beatCount = 0;

        const drumIntervalTimer = setInterval(() => {
          if (!audioCtx || audioCtx.currentTime >= endTime || !state.isDrawing) {
            clearInterval(drumIntervalTimer);
            return;
          }

          try {
            const now = audioCtx.currentTime;
            const progress = (now - startTime) / durationSec;

            if (beatCount % 4 === 0) {
              const kickOsc = audioCtx.createOscillator();
              const kickGain = audioCtx.createGain();
              kickOsc.type = 'sine';
              kickOsc.frequency.setValueAtTime(180, now);
              kickOsc.frequency.exponentialRampToValueAtTime(30, now + 0.16);
              kickGain.gain.setValueAtTime(0.75, now);
              kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
              kickOsc.connect(kickGain);
              kickGain.connect(audioCtx.destination);
              kickOsc.start(now);
              kickOsc.stop(now + 0.16);
            }

            const snareOsc = audioCtx.createOscillator();
            const snareGain = audioCtx.createGain();
            snareOsc.type = 'triangle';
            snareOsc.frequency.setValueAtTime(260 + (progress * 220), now);
            snareGain.gain.setValueAtTime(0.65, now);
            snareGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            snareOsc.connect(snareGain);
            snareGain.connect(audioCtx.destination);
            snareOsc.start(now);
            snareOsc.stop(now + 0.09);

            beatCount++;
          } catch (e) {}
        }, 75);

        const fanfareNotes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
        fanfareNotes.forEach((freq, idx) => {
          const noteTime = startTime + 1.2 + (idx * 0.7);
          if (noteTime < endTime) {
            setTimeout(() => {
              if (state.isDrawing) {
                playBeep(freq, 'sawtooth', 0.5, 0.08);
                playBeep(freq * 1.5, 'triangle', 0.4, 0.05);
              }
            }, (noteTime - startTime) * 1000);
          }
        });

      } catch (e) {}
    }

    function playSkySweepSound() {
      if (!state.audioEnabled) return;
      try {
        initAudioContext();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 1.4);
        
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.4);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.4);
      } catch (e) {}
    }

    function playCosmicFanfare() {
      if (!state.audioEnabled) return;
      try {
        initAudioContext();
        if (!audioCtx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            playBeep(freq, 'triangle', 0.45, 0.18);
          }, idx * 110);
        });
      } catch (e) {}
    }

    function resizeCanvas() {
      try {
        const canvas = document.getElementById('sky-canvas');
        if (!canvas) return;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initStars(canvas.width, canvas.height);
      } catch (e) {}
    }

    function initStars(w, h) {
      stars = [];
      const starCount = Math.floor((w * h) / 2500);
      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          size: Math.random() * 2.0 + 0.3,
          alpha: Math.random(),
          speed: Math.random() * 0.018 + 0.005
        });
      }
    }

    function draw5PointStar(ctx, cx, cy, outerRadius, innerRadius, rotation) {
      ctx.beginPath();
      const numPoints = 5;
      for (let i = 0; i < numPoints * 2; i++) {
        const radius = i % 2 === 0 ? outerRadius : innerRadius;
        const angle = rotation + (i * Math.PI) / numPoints - Math.PI / 2;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.closePath();
    }

    function renderSky() {
      try {
        const canvas = document.getElementById('sky-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);

        stars.forEach(star => {
          star.alpha += star.speed;
          const currentAlpha = (Math.sin(star.alpha) + 1) / 2;
          ctx.fillStyle = `rgba(224, 242, 254, ${currentAlpha * 0.85 + 0.15})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
        });

        if (Math.random() < 0.035) {
          shootingStars.push({
            x: Math.random() * w,
            y: Math.random() * (h * 0.5),
            length: Math.random() * 100 + 50,
            speed: Math.random() * 10 + 12,
            dx: Math.random() * 4 + 6,
            dy: Math.random() * 3 + 2,
            life: 1.0
          });
        }

        for (let i = shootingStars.length - 1; i >= 0; i--) {
          const s = shootingStars[i];
          const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.dx * (s.length / 10), s.y - s.dy * (s.length / 10));
          grad.addColorStop(0, `rgba(255, 215, 0, ${s.life})`);
          grad.addColorStop(1, 'rgba(0, 240, 255, 0)');

          ctx.strokeStyle = grad;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - s.dx * (s.length / 10), s.y - s.dy * (s.length / 10));
          ctx.stroke();

          s.x += s.dx;
          s.y += s.dy;
          s.life -= 0.022;

          if (s.life <= 0 || s.x > w || s.y > h) {
            shootingStars.splice(i, 1);
          }
        }

        if (hugeShootingStar) {
          const now = performance.now();
          const elapsed = now - hugeShootingStar.startTime;
          const p = Math.min(1.0, elapsed / hugeShootingStar.duration);

          const easeP = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
          const currentX = hugeShootingStar.startX + (hugeShootingStar.endX - hugeShootingStar.startX) * easeP;
          const currentY = hugeShootingStar.startY + (hugeShootingStar.endY - hugeShootingStar.startY) * easeP;

          const scaleEnvelope = Math.sin(p * Math.PI);
          const maxRadius = Math.max(w, h) * 1.35;
          const minRadius = 120;
          const currentOuterRadius = minRadius + (maxRadius - minRadius) * Math.pow(scaleEnvelope, 0.7);
          const currentInnerRadius = currentOuterRadius * 0.38;
          const rotation = easeP * Math.PI * 2.2;

          ctx.save();

          const tailX = currentX - (hugeShootingStar.endX - hugeShootingStar.startX) * 0.25;
          const tailY = currentY - (hugeShootingStar.endY - hugeShootingStar.startY) * 0.25;

          const trailGrad = ctx.createLinearGradient(currentX, currentY, tailX, tailY);
          trailGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
          trailGrad.addColorStop(0.3, 'rgba(255, 215, 0, 0.9)');
          trailGrad.addColorStop(0.7, 'rgba(0, 240, 255, 0.5)');
          trailGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.lineWidth = Math.max(20, currentOuterRadius * 0.35);
          ctx.strokeStyle = trailGrad;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(currentX, currentY);
          ctx.stroke();

          const glowGrad = ctx.createRadialGradient(currentX, currentY, 10, currentX, currentY, currentOuterRadius * 1.25);
          glowGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
          glowGrad.addColorStop(0.35, 'rgba(255, 215, 0, 0.85)');
          glowGrad.addColorStop(0.7, 'rgba(0, 240, 255, 0.5)');
          glowGrad.addColorStop(1, 'rgba(2, 2, 8, 0)');

          ctx.fillStyle = glowGrad;
          ctx.beginPath();
          ctx.arc(currentX, currentY, currentOuterRadius * 1.25, 0, Math.PI * 2);
          ctx.fill();

          draw5PointStar(ctx, currentX, currentY, currentOuterRadius, currentInnerRadius, rotation);
          
          const starGrad = ctx.createRadialGradient(currentX, currentY, 0, currentX, currentY, currentOuterRadius);
          starGrad.addColorStop(0, '#ffffff');
          starGrad.addColorStop(0.3, '#fef08a');
          starGrad.addColorStop(0.65, '#ffd700');
          starGrad.addColorStop(1, '#d97706');

          ctx.fillStyle = starGrad;
          ctx.fill();

          ctx.strokeStyle = '#00f0ff';
          ctx.lineWidth = Math.max(4, currentOuterRadius * 0.02);
          ctx.stroke();

          ctx.restore();

          if (p >= 0.5 && !hugeShootingStar.hasTriggeredReveal) {
            hugeShootingStar.hasTriggeredReveal = true;
            if (hugeShootingStar.onRevealTrigger) {
              hugeShootingStar.onRevealTrigger();
            }
          }

          if (p >= 1.0) {
            hugeShootingStar = null;
          }
        }
      } catch (e) {}

      requestAnimationFrame(renderSky);
    }

    function populateScrollTrack() {
      try {
        const track = document.getElementById('names-scroll-track');
        if (!track) return;

        if (state.participants.length === 0) {
          track.innerHTML = '<div class="px-6 text-rose-400">NO EXPLORERS AVAILABLE - ADD PARTICIPANTS</div>';
          return;
        }

        let items = [];
        const fillCount = Math.max(30, state.participants.length * 3);
        for (let i = 0; i < fillCount; i++) {
          const participant = state.participants[i % state.participants.length];
          const displayName = typeof participant === 'object' ? participant.name : participant;
          items.push(`<div class="name-item inline-block px-6 sm:px-10 py-1 transition-all duration-200" data-name="${escapeHtml(displayName)}">${escapeHtml(displayName)}</div>`);
        }
        track.innerHTML = items.join('');
        track.style.transform = 'translateX(0px)';

        setTimeout(updateReticleSizeToCenterItem, 50);
      } catch (err) {}
    }

    function updateReticleSizeToCenterItem() {
      try {
        const container = document.getElementById('names-scroll-container');
        const reticle = document.getElementById('target-reticle');
        if (!container || !reticle) return;

        const containerRect = container.getBoundingClientRect();
        const containerCenter = containerRect.left + containerRect.width / 2;

        const items = document.querySelectorAll('.name-item');
        let closestItem = null;
        let minDistance = Infinity;

        items.forEach(item => {
          const itemRect = item.getBoundingClientRect();
          const itemCenter = itemRect.left + itemRect.width / 2;
          const dist = Math.abs(containerCenter - itemCenter);
          if (dist < minDistance) {
            minDistance = dist;
            closestItem = item;
          }
        });

        if (closestItem) {
          const targetWidth = Math.max(220, closestItem.offsetWidth + 72);
          reticle.style.width = `${targetWidth}px`;
        }
      } catch (e) {}
    }

    function startTelescopeDrawSequence() {
      try {
        if (state.isDrawing) return;

        if (state.participants.length === 0) {
          showToast("EXPLORER POOL IS EMPTY! ADD PARTICIPANTS FIRST.", "warning");
          openManageModal();
          return;
        }

        initAudioContext();
        state.isDrawing = true;

        playSpinDrumRollLoop(6.5);

        const drawBtn = document.getElementById('draw-main-btn');
        drawBtn.disabled = true;
        drawBtn.classList.add('opacity-50', 'cursor-not-allowed');

        const telescopeRig = document.getElementById('telescope-rig');
        telescopeRig.className = 'telescope-centered absolute z-20 w-[135vh] h-[135vh] min-w-[135vh] min-h-[135vh] rounded-full flex items-center justify-center top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2';

        const skyWinner = document.getElementById('sky-winner-container');
        skyWinner.className = 'sky-winner-hidden absolute z-30 max-w-[94vw] sm:max-w-[88vw] md:max-w-[80vw] flex flex-col items-center justify-center text-center';

        const winnerIndex = Math.floor(Math.random() * state.participants.length);
        const winningParticipant = state.participants[winnerIndex];
        const winningName = typeof winningParticipant === 'object' ? winningParticipant.name : winningParticipant;
        const winningTicket = typeof winningParticipant === 'object' ? winningParticipant.ticket : `TICKET #${1000 + winnerIndex}`;

        populateScrollTrack();
        
        // Use requestAnimationFrame to guarantee browser layout calculation is complete before measuring bounding rects on the first try
        requestAnimationFrame(() => {
          try {
            const track = document.getElementById('names-scroll-track');
            if (!track) {
              resetDrawState();
              return;
            }
            track.style.transform = 'translateX(0px)';

            const items = track.querySelectorAll('.name-item');
            items.forEach(el => el.classList.remove('text-amber-300', 'scale-125', 'drop-shadow-[0_0_25px_rgba(255,215,0,1)]', 'z-10'));

            let targetItemIndex = -1;
            const searchStartIndex = 15;
            for (let i = searchStartIndex; i < items.length; i++) {
              if (items[i].textContent.trim() === winningName.trim()) {
                targetItemIndex = i;
                break;
              }
            }
            if (targetItemIndex === -1) {
              for (let i = 0; i < items.length; i++) {
                if (items[i].textContent.trim() === winningName.trim()) {
                  targetItemIndex = i;
                  break;
                }
              }
            }

            const container = document.getElementById('names-scroll-container');
            if (!container || targetItemIndex === -1) {
              resetDrawState();
              return;
            }

            const containerRect = container.getBoundingClientRect();
            const targetElement = items[targetItemIndex];
            const targetRect = targetElement.getBoundingClientRect();

            const containerCenterX = containerRect.left + containerRect.width / 2;
            const targetCenterX = targetRect.left + targetRect.width / 2;
            const finalX = containerCenterX - targetCenterX;

            const startTime = Date.now();
            const duration = 6500; 
            const startX = 0;
            let lastBeepTime = 0;

            function animateScroll() {
              try {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(1, elapsed / duration);

                const easeOut = 1 - Math.pow(1 - progress, 3);
                const currentX = startX + (finalX - startX) * easeOut;

                track.style.transform = `translateX(${currentX}px)`;
                updateReticleSizeToCenterItem();

                const timeBetweenBeeps = 90 + (progress * 420);
                if (Date.now() - lastBeepTime > timeBetweenBeeps && progress < 0.98) {
                  playBeep(380 + ((1 - progress) * 320), 'sine', 0.05, 0.035);
                  lastBeepTime = Date.now();
                }

                if (progress < 1) {
                  requestAnimationFrame(animateScroll);
                } else {
                  track.style.transform = `translateX(${finalX}px)`;
                  targetElement.classList.add('text-amber-300', 'scale-125', 'drop-shadow-[0_0_25px_rgba(255,215,0,1)]', 'z-10');
                  updateReticleSizeToCenterItem();
                  
                  playBeep(880, 'square', 0.35, 0.15);

                  setTimeout(() => {
                    executeCameraPanToSky(winningName, winningTicket, winnerIndex);
                  }, 1200);
                }
              } catch (err) {
                resetDrawState();
              }
            }

            requestAnimationFrame(animateScroll);
          } catch (e) {
            resetDrawState();
          }
        });
      } catch (e) {
        resetDrawState();
      }
    }

    function executeCameraPanToSky(winnerName, winnerTicket, winnerIndex) {
      try {
        const telescopeRig = document.getElementById('telescope-rig');
        const skyWinner = document.getElementById('sky-winner-container');
        const skyName = document.getElementById('sky-winner-name');
        const skyTicket = document.getElementById('sky-winner-ticket');

        telescopeRig.className = 'telescope-exited absolute z-20 w-[135vh] h-[135vh] min-w-[135vh] min-h-[135vh] rounded-full flex items-center justify-center top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2';

        playSkySweepSound();

        skyName.innerText = winnerName;
        skyTicket.innerText = winnerTicket;

        const canvas = document.getElementById('sky-canvas');
        const w = canvas ? canvas.width : window.innerWidth;
        const h = canvas ? canvas.height : window.innerHeight;

        hugeShootingStar = {
          startTime: performance.now(),
          duration: 1400,
          startX: -300,
          startY: -300,
          endX: w + 400,
          endY: h + 400,
          hasTriggeredReveal: false,
          onRevealTrigger: function() {
            skyWinner.className = 'sky-winner-visible absolute z-30 max-w-[94vw] sm:max-w-[88vw] md:max-w-[80vw] flex flex-col items-center justify-center text-center';
            
            playCosmicFanfare();

            recordWinner(winnerName, winnerTicket);
            if (state.removeWinnerAfterDraw) {
              state.participants.splice(winnerIndex, 1);
              saveEntries();
              updateBadgeCounts();
            }

            resetDrawState();
          }
        };
      } catch (err) {
        resetDrawState();
      }
    }

    function resetTelescopeToCenter() {
      try {
        const telescopeRig = document.getElementById('telescope-rig');
        const skyWinner = document.getElementById('sky-winner-container');

        skyWinner.className = 'sky-winner-hidden absolute z-30 max-w-[94vw] sm:max-w-[88vw] md:max-w-[80vw] flex flex-col items-center justify-center text-center';

        setTimeout(() => {
          telescopeRig.className = 'telescope-centered absolute z-20 w-[135vh] h-[135vh] min-w-[135vh] min-h-[135vh] rounded-full flex items-center justify-center top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2';
          populateScrollTrack();
        }, 400);
      } catch (e) {}
    }

    function resetDrawState() {
      state.isDrawing = false;
      const drawBtn = document.getElementById('draw-main-btn');
      if (drawBtn) {
        drawBtn.disabled = false;
        drawBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    }

    function openManageModal() {
      try {
        renderManageTable();
        const modal = document.getElementById('manage-modal');
        modal.classList.remove('opacity-0', 'pointer-events-none');
      } catch (e) {}
    }

    function closeManageModal() {
      try {
        const modal = document.getElementById('manage-modal');
        modal.classList.add('opacity-0', 'pointer-events-none');
        updateBadgeCounts();
        populateScrollTrack();
      } catch (e) {}
    }

    function renderManageTable() {
      try {
        const tbody = document.getElementById('manage-table-body');
        if (!tbody) return;

        if (state.participants.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-500 font-mono">NO EXPLORERS AVAILABLE</td></tr>`;
          return;
        }

        tbody.innerHTML = state.participants.map((p, idx) => {
          const name = typeof p === 'object' ? p.name : p;
          const ticket = typeof p === 'object' ? p.ticket : `TICKET #${1000 + idx}`;
          return `
            <tr class="hover:bg-slate-900/60">
              <td class="py-1.5 px-2 text-slate-500">${idx + 1}</td>
              <td class="py-1.5 px-2 text-cyan-200 font-semibold">${escapeHtml(name)}</td>
              <td class="py-1.5 px-2 text-amber-300 font-mono">${escapeHtml(ticket)}</td>
              <td class="py-1.5 px-2 text-right">
                <button onclick="removeSingleParticipant(${idx})" class="text-rose-400 hover:text-rose-200 px-2 py-0.5 rounded bg-rose-950/30 border border-rose-800/40">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </td>
            </tr>
          `;
        }).join('');

        document.getElementById('manage-pool-count').innerText = state.participants.length;
      } catch (e) {}

    function removeSingleParticipant(index) {
      if (index >= 0 && index < state.participants.length) {
        const removed = state.participants.splice(index, 1);
        saveEntries();
        renderManageTable();
        updateBadgeCounts();
        const remName = typeof removed[0] === 'object' ? removed[0].name : removed[0];
        showToast(`REMOVED: ${remName}`);
      }
    }

    function processBulkEntries() {
      const text = document.getElementById('bulk-input-text').value;
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) {
        showToast("NO VALID NAMES ENTERED", "warning");
        return;
      }

      const newEntries = lines.map((name, i) => ({
        name: name,
        ticket: `TICKET #${Math.floor(Math.random() * 8999 + 1000)}`,
        id: Date.now() + i
      }));

      state.participants.push(...newEntries);
      saveEntries();
      renderManageTable();
      updateBadgeCounts();
      document.getElementById('bulk-input-text').value = '';
      showToast(`ADDED ${lines.length} PARTICIPANTS`);
    }

    function replaceWithBulkEntries() {
      const text = document.getElementById('bulk-input-text').value;
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) {
        showToast("NO VALID NAMES ENTERED", "warning");
        return;
      }

      state.participants = lines.map((name, i) => ({
        name: name,
        ticket: `TICKET #${Math.floor(Math.random() * 8999 + 1000)}`,
        id: Date.now() + i
      }));

      saveEntries();
      renderManageTable();
      updateBadgeCounts();
      document.getElementById('bulk-input-text').value = '';
      showToast(`POOL REPLACED WITH ${lines.length} EXPLORERS`);
    }

    function loadSampleEntries(count = 200) {
      const sampleCallsigns = [
        'Astra', 'Vanguard', 'Orion', 'Helios', 'Nova', 'Titan', 'Apex', 'Spectra', 'Cygnus', 'Nebula',
        'Phoenix', 'Zenith', 'Polaris', 'Solaria', 'Eclipse', 'Pioneer', 'Voyager', 'Galaxion', 'Starlight', 'Hyperion'
      ];
      
      state.participants = Array.from({ length: count }, (_, i) => {
        const prefix = sampleCallsigns[i % sampleCallsigns.length];
        const num = String(i + 1).padStart(3, '0');
        return {
          name: `Explorer ${prefix}-${num}`,
          ticket: `TICKET #${1000 + i}`,
          id: i + 1
        };
      });

      saveEntries();
      renderManageTable();
      updateBadgeCounts();
      showToast(`LOADED ${count} SAMPLE PARTICIPANTS`);
    }

    function confirmClearAllEntries() {
      state.participants = [];
      saveEntries();
      renderManageTable();
      updateBadgeCounts();
      showToast("EXPLORER POOL CLEARED", "warning");
    }

    function togglePoolRemovalMode() {
      state.removeWinnerAfterDraw = !state.removeWinnerAfterDraw;
      const lbl = document.getElementById('remove-toggle-label');
      if (lbl) {
        lbl.innerText = `REMOVE WINNER AFTER DRAW: ${state.removeWinnerAfterDraw ? 'ON' : 'OFF'}`;
      }
      showToast(`WINNER AUTO-REMOVE: ${state.removeWinnerAfterDraw ? 'ENABLED' : 'DISABLED'}`);
    }

    function recordWinner(name, ticket) {
      try {
        const record = {
          name: name,
          ticket: ticket,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        };
        state.winners.unshift(record);
        renderWinnerHistory();
        
        const drawer = document.getElementById('history-drawer');
        if (drawer && drawer.classList.contains('translate-x-[120%]')) {
          drawer.classList.remove('translate-x-[120%]', 'opacity-0', 'pointer-events-none');
        }
      } catch (e) {}
    }

    function renderWinnerHistory() {
      try {
        const container = document.getElementById('winner-history-list');
        if (!container) return;

        if (state.winners.length === 0) {
          container.innerHTML = `<div class="text-amber-300/50 text-center py-6">NO WINNERS RECORDED YET</div>`;
          return;
        }

        container.innerHTML = state.winners.map((w, idx) => `
          <div class="p-2.5 rounded-xl bg-amber-950/40 border border-amber-500/30 flex flex-col space-y-1">
            <div class="flex justify-between items-center">
              <span class="text-amber-200 font-bold">#${state.winners.length - idx} ${escapeHtml(w.name)}</span>
              <span class="text-[10px] text-amber-400/60">${w.time}</span>
            </div>
            <div class="text-[11px] text-amber-300/90 font-bold">Ticket: ${escapeHtml(w.ticket)}</div>
          </div>
        `).join('');
      } catch (e) {}
    }

    function toggleWinnerHistoryDrawer() {
      try {
        const drawer = document.getElementById('history-drawer');
        if (state.isWinnerDrawerPinned) return;

        const isHidden = drawer.classList.contains('translate-x-[120%]');
        if (isHidden) {
          drawer.classList.remove('translate-x-[120%]', 'opacity-0', 'pointer-events-none');
        } else {
          drawer.classList.add('translate-x-[120%]', 'opacity-0', 'pointer-events-none');
        }
      } catch (e) {}
    }

    function togglePinWinnerDrawer() {
      state.isWinnerDrawerPinned = !state.isWinnerDrawerPinned;
      const pinBtn = document.getElementById('pin-winner-btn');
      const pinIcon = document.getElementById('pin-icon');

      if (state.isWinnerDrawerPinned) {
        pinBtn.classList.add('bg-amber-500/30', 'border-amber-400', 'text-amber-200');
        pinIcon.className = 'fa-solid fa-thumbtack text-amber-300';
        showToast("HALL OF WINNERS PINNED OPEN");
      } else {
        pinBtn.classList.remove('bg-amber-500/30', 'border-amber-400', 'text-amber-200');
        pinIcon.className = 'fa-solid fa-thumbtack';
        showToast("UNPINNED WINNERS DRAWER");
      }
    }

    function clearWinnerHistory() {
      state.winners = [];
      renderWinnerHistory();
      showToast("WINNER HISTORY CLEARED");
    }

    function exportWinnersList() {
      try {
        if (state.winners.length === 0) {
          showToast("NO WINNERS TO EXPORT", "warning");
          return;
        }

        const lines = state.winners.map((w, i) => `${i + 1}. ${w.name} - ${w.ticket} (${w.time})`).join('\n');
        const blob = new Blob([lines], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `cosmic_lucky_draw_winners_${Date.now()}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast("EXPORTED WINNERS FILE");
      } catch (e) {}
    }

    function showToast(msg, type = "info") {
      try {
        const toast = document.getElementById('hud-toast');
        const toastMsg = document.getElementById('hud-toast-msg');
        const toastIcon = document.getElementById('hud-toast-icon');

        if (!toast || !toastMsg) return;

        toastMsg.innerText = msg;
        if (type === "warning") {
          toastIcon.className = "fa-solid fa-triangle-exclamation text-amber-400 text-base";
        } else {
          toastIcon.className = "fa-solid fa-circle-info text-cyan-400 text-base";
        }

        toast.classList.remove('-translate-y-10', 'opacity-0', 'pointer-events-none');
        toast.classList.add('translate-y-0', 'opacity-100');

        setTimeout(() => {
          toast.classList.add('-translate-y-10', 'opacity-0', 'pointer-events-none');
          toast.classList.remove('translate-y-0', 'opacity-100');
        }, 2800);
      } catch (e) {}
    }

    function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {});
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          }
        }
      } catch (e) {}
    }

    window.addEventListener('resize', resizeCanvas);

    window.onload = async function () {
      try {
        resizeCanvas();
        await autoSyncOnLoad();
        updateBadgeCounts();
        populateScrollTrack();
        renderWinnerHistory();
        renderSky();

        document.body.addEventListener('click', () => {
          initAudioContext();
        }, { once: true });
      } catch (err) {}
    };
  </script>
</body>
</html>
