  <style>
    html, body {
      background-color: #020208;
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden !important;
      user-select: none;
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(7, 10, 22, 0.8);
      border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.35);
      border-radius: 8px;
      border: 1px solid rgba(0, 240, 255, 0.5);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 240, 255, 0.65);
    }

    .glass-panel {
      background: rgba(8, 12, 28, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .glass-panel-gold {
      background: rgba(28, 22, 8, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 215, 0, 0.5);
    }

    #perspective-scene {
      perspective: 1400px;
      perspective-origin: 50% 50%;
    }

    #telescope-rig {
      transition: transform 1.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.4s ease, filter 1.2s ease;
      transform-style: preserve-3d;
      transform-origin: 50% 50%;
    }

    .telescope-centered {
      transform: translate3d(0px, 0px, 0px) scale(1);
      opacity: 1;
      filter: blur(0px);
    }

    .telescope-exited {
      transform: translate3d(0px, 130vh, -150px) scale(0.75);
      opacity: 0;
      filter: blur(10px);
      pointer-events: none;
    }

    #sky-winner-container {
      transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.6s ease, filter 1.6s ease;
      transform-style: preserve-3d;
      transform-origin: 50% 20%;

    .sky-winner-hidden {

      filter: blur(30px) brightness(0.2);
      transform: translate3d(0px, -150px, -300px) rotateX(35deg) scale(0.7);
      pointer-events: none;
    }

    .sky-winner-visible {
      opacity: 1;
      filter: blur(0px) brightness(1.2);
      transform: translate3d(0px, 20px, 80px) rotateX(16deg) scale(1);
    }

    @keyframes hud-rotate {

      to { transform: rotate(360deg); }

    .animate-hud-spin {
      animation: hud-rotate 28s linear infinite;
    }

      animation: hud-rotate 20s linear infinite reverse;
    }

    .scanlines::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.2;
    }
  </style>
</head>

  <script>
    // Supabase State & Client
    let supabaseClient = null;
    let state = {
      participants: [], // Objects: { id, name, room, ticket }
      winners: [],
      isDrawing: false,
      removeWinnerAfterDraw: true,
      audioEnabled: true,
      isWinnerDrawerPinned: false
    };

    let audioCtx = null;
    let stars = [];
    let shootingStars = [];
    let hugeShootingStar = null;

    function initSupabaseClient() {
      try {
        const urlInput = document.getElementById('supabase-url-input').value.trim();
        const keyInput = document.getElementById('supabase-key-input').value.trim();
        if (window.supabase && urlInput && keyInput) {
          supabaseClient = window.supabase.createClient(urlInput, keyInput);
        }
      } catch (e) {
        console.warn("Supabase init warning:", e);
      }
    }

    async function loadSupabaseGuests() {
      try {
        if (!supabaseClient) initSupabaseClient();
        if (!supabaseClient) {
          showToast("SUPABASE CLIENT NOT INITIALIZED", "warning");
          return;
        }

        showToast("FETCHING ATTENDEES FROM SUPABASE...");
        const { data, error } = await supabaseClient
          .from('guests')
          .select('*')
          .order('id', { ascending: true });

        if (error) throw error;

        if (data && Array.isArray(data)) {
          state.participants = data.map(g => ({
            id: g.id,
            name: g.name || 'Anonymous Explorer',
            room: g.room || 'N/A',
            ticket: g.ticket || `#STAR-${String(g.id).padStart(3, '0')}`
          }));
          updateBadgeCounts();
          populateScrollTrack();
          renderManageTable();
          showToast(`LOADED ${state.participants.length} ATTENDEES FROM SUPABASE!`);
        }
      } catch (err) {
        console.error("Supabase fetch error:", err);
        showToast("FAILED TO FETCH FROM SUPABASE. CHECK CREDENTIALS.", "warning");
      }
    }

    function reconnectSupabase() {
      initSupabaseClient();
      loadSupabaseGuests();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function updateBadgeCounts() {
      try {
        const badge = document.getElementById('badge-entry-count');
        if (badge) badge.innerText = state.participants.length;
        const modalCount = document.getElementById('manage-pool-count');
        if (modalCount) modalCount.innerText = state.participants.length;
      } catch (e) {
        console.error('Update badge count error:', e);
      }
    }

    function initAudioContext() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn('Audio Context initialization error:', e);
      }
    }

    function playBeep(freq = 440, type = 'sine', duration = 0.05, vol = 0.05) {
      if (!state.audioEnabled) return;
      try {
        initAudioContext();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn('Play beep audio error:', e);
      }
    }

    function playCosmicFanfare() {
      if (!state.audioEnabled) return;
      try {
        initAudioContext();
        if (!audioCtx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        notes.forEach((freq, idx) => {
          setTimeout(() => {
            playBeep(freq, 'triangle', 0.45, 0.18);
          }, idx * 110);
        });
      } catch (e) {
        console.warn('Fanfare sound error:', e);

    function initStars(w, h) {
      stars = [];
      const starCount = Math.floor((w * h) / 2500);
      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          size: Math.random() * 2.0 + 0.3,
          alpha: Math.random(),
          speed: Math.random() * 0.018 + 0.005
        });
      }
    }

    function draw5PointStar(ctx, cx, cy, outerRadius, innerRadius, rotation) {
      ctx.beginPath();
      const numPoints = 5;
      for (let i = 0; i < numPoints * 2; i++) {
        const radius = i % 2 === 0 ? outerRadius : innerRadius;
        const angle = rotation + (i * Math.PI) / numPoints - Math.PI / 2;
        const x = cx + Math.cos(angle) * radius;
        const y = cy + Math.sin(angle) * radius;
        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.closePath();
    }

    function renderSky() {
      try {
        const canvas = document.getElementById('sky-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);

        stars.forEach(star => {
          star.alpha += star.speed;
          const currentAlpha = (Math.sin(star.alpha) + 1) / 2;
          ctx.fillStyle = `rgba(224, 242, 254, ${currentAlpha * 0.85 + 0.15})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
        });

        if (Math.random() < 0.035) {
          shootingStars.push({
            x: Math.random() * w,
            y: Math.random() * (h * 0.5),
            length: Math.random() * 100 + 50,
            speed: Math.random() * 10 + 12,
            dx: Math.random() * 4 + 6,
            dy: Math.random() * 3 + 2,
            life: 1.0
          });
        }

        for (let i = shootingStars.length - 1; i >= 0; i--) {
          const s = shootingStars[i];
          const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.dx * (s.length / 10), s.y - s.dy * (s.length / 10));
          grad.addColorStop(0, `rgba(255, 215, 0, ${s.life})`);
          grad.addColorStop(1, 'rgba(0, 240, 255, 0)');

          ctx.strokeStyle = grad;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - s.dx * (s.length / 10), s.y - s.dy * (s.length / 10));
          ctx.stroke();

          s.x += s.dx;
          s.y += s.dy;
          s.life -= 0.022;

          if (s.life <= 0 || s.x > w || s.y > h) {
            shootingStars.splice(i, 1);
          }
        }

        if (hugeShootingStar) {
          const now = performance.now();
          const elapsed = now - hugeShootingStar.startTime;
          const p = Math.min(1.0, elapsed / hugeShootingStar.duration);
          const easeP = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

          const currentX = hugeShootingStar.startX + (hugeShootingStar.endX - hugeShootingStar.startX) * easeP;
          const currentY = hugeShootingStar.startY + (hugeShootingStar.endY - hugeShootingStar.startY) * easeP;

          const scaleEnvelope = Math.sin(p * Math.PI);
          const maxRadius = Math.max(w, h) * 1.35;
          const minRadius = 120;
          const currentOuterRadius = minRadius + (maxRadius - minRadius) * Math.pow(scaleEnvelope, 0.7);
          const currentInnerRadius = currentOuterRadius * 0.38;
          const rotation = easeP * Math.PI * 2.2;

          ctx.save();

          const tailX = currentX - (hugeShootingStar.endX - hugeShootingStar.startX) * 0.25;
          const tailY = currentY - (hugeShootingStar.endY - hugeShootingStar.startY) * 0.25;

          const trailGrad = ctx.createLinearGradient(currentX, currentY, tailX, tailY);
          trailGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
          trailGrad.addColorStop(0.3, 'rgba(255, 215, 0, 0.9)');
          trailGrad.addColorStop(0.7, 'rgba(0, 240, 255, 0.5)');
          trailGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.lineWidth = Math.max(20, currentOuterRadius * 0.35);
          ctx.strokeStyle = trailGrad;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(currentX, currentY);
          ctx.stroke();

          const glowGrad = ctx.createRadialGradient(currentX, currentY, 10, currentX, currentY, currentOuterRadius * 1.25);
          glowGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
          glowGrad.addColorStop(0.35, 'rgba(255, 215, 0, 0.85)');
          glowGrad.addColorStop(0.7, 'rgba(0, 240, 255, 0.5)');
          glowGrad.addColorStop(1, 'rgba(2, 2, 8, 0)');

          ctx.fillStyle = glowGrad;
          ctx.beginPath();
          ctx.arc(currentX, currentY, currentOuterRadius * 1.25, 0, Math.PI * 2);
          ctx.fill();

          draw5PointStar(ctx, currentX, currentY, currentOuterRadius, currentInnerRadius, rotation);
          
          const starGrad = ctx.createRadialGradient(currentX, currentY, 0, currentX, currentY, currentOuterRadius);
          starGrad.addColorStop(0, '#ffffff');
          starGrad.addColorStop(0.3, '#fef08a');
          starGrad.addColorStop(0.65, '#ffd700');
          starGrad.addColorStop(1, '#d97706');

          ctx.fillStyle = starGrad;
          ctx.fill();

          ctx.strokeStyle = '#00f0ff';
          ctx.lineWidth = Math.max(4, currentOuterRadius * 0.02);
          ctx.stroke();

          ctx.restore();

          if (p >= 0.5 && !hugeShootingStar.hasTriggeredReveal) {
            hugeShootingStar.hasTriggeredReveal = true;
            if (hugeShootingStar.onRevealTrigger) {
              hugeShootingStar.onRevealTrigger();
            }
          }

          if (p >= 1.0) {
            hugeShootingStar = null;
          }
        }

      } catch (e) {
        console.error('Sky render frame error:', e);
      }

      requestAnimationFrame(renderSky);
    }

    function populateScrollTrack() {
      try {
        const track = document.getElementById('names-scroll-track');
        if (!track) return;

        if (state.participants.length === 0) {
          track.innerHTML = '<div class="px-8 text-rose-400">NO ATTENDEES LOADED FROM SUPABASE</div>';
          return;
        }

        let items = [];
        const fillCount = Math.max(30, state.participants.length * 3);
        for (let i = 0; i < fillCount; i++) {
          const guest = state.participants[i % state.participants.length];
          items.push(`<div class="name-item inline-block px-8 sm:px-12 py-1 transition-all duration-200">${escapeHtml(guest.name)} <span class="text-xs text-amber-400/80 font-mono">(${escapeHtml(guest.ticket)})</span></div>`);
        }
        track.innerHTML = items.join('');
        track.style.transform = 'translateX(0px)';

        setTimeout(updateReticleSizeToCenterItem, 50);
      } catch (err) {
        console.error("Populate scroll track error:", err);
      }
    }

    function updateReticleSizeToCenterItem() {
      try {
        const container = document.getElementById('names-scroll-container');
        const reticle = document.getElementById('target-reticle');
        if (!container || !reticle) return;

        const containerRect = container.getBoundingClientRect();
        const containerCenter = containerRect.left + containerRect.width / 2;

        const items = document.querySelectorAll('.name-item');
        let closestItem = null;
        let minDistance = Infinity;

        items.forEach(item => {
          const itemRect = item.getBoundingClientRect();
          const itemCenter = itemRect.left + itemRect.width / 2;
          const dist = Math.abs(containerCenter - itemCenter);
          if (dist < minDistance) {
            minDistance = dist;
            closestItem = item;
          }
        });

        if (closestItem) {
          const targetWidth = Math.max(240, closestItem.offsetWidth + 72);
          reticle.style.width = `${targetWidth}px`;
        }
      } catch (e) {
        console.warn("Update reticle size error:", e);
      }
    }

    function startTelescopeDrawSequence() {
      try {
        if (state.isDrawing) return;

        if (state.participants.length === 0) {
          showToast("ATTENDEE POOL IS EMPTY! CHECK SUPABASE CONNECTION.", "warning");
          openManageModal();
          return;
        }

        initAudioContext();
        state.isDrawing = true;

        const drawBtn = document.getElementById('draw-main-btn');
        drawBtn.disabled = true;
        drawBtn.classList.add('opacity-50', 'cursor-not-allowed');

        const telescopeRig = document.getElementById('telescope-rig');
        telescopeRig.className = 'telescope-centered absolute z-20 w-[135vh] h-[135vh] min-w-[135vh] min-h-[135vh] rounded-full flex items-center justify-center top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2';

        const skyWinner = document.getElementById('sky-winner-container');
        skyWinner.className = 'sky-winner-hidden absolute z-30 max-w-[94vw] sm:max-w-[88vw] md:max-w-[80vw] flex flex-col items-center justify-center text-center';

        const winnerIndex = Math.floor(Math.random() * state.participants.length);
        const winningGuest = state.participants[winnerIndex];

        populateScrollTrack();
        const track = document.getElementById('names-scroll-track');
        track.style.transform = 'translateX(0px)';

        const items = track.querySelectorAll('.name-item');
        items.forEach(el => el.classList.remove('text-amber-300', 'scale-125', 'drop-shadow-[0_0_25px_rgba(255,215,0,1)]', 'z-10'));

        let targetItemIndex = -1;
        const searchStartIndex = 15;
        for (let i = searchStartIndex; i < items.length; i++) {
          if (items[i].textContent.includes(winningGuest.name)) {
            targetItemIndex = i;
            break;
          }
        }
        if (targetItemIndex === -1) {
          for (let i = 0; i < items.length; i++) {
            if (items[i].textContent.includes(winningGuest.name)) {
              targetItemIndex = i;
              break;
            }
          }
        }

        const container = document.getElementById('names-scroll-container');
        if (!container || targetItemIndex === -1) return;

        const containerRect = container.getBoundingClientRect();
        const targetElement = items[targetItemIndex];
        const targetRect = targetElement.getBoundingClientRect();

        const containerCenterX = containerRect.left + containerRect.width / 2;
        const targetCenterX = targetRect.left + targetRect.width / 2;
        const finalX = containerCenterX - targetCenterX;

        const startTime = Date.now();
        const duration = 6500; 
        const startX = 0;
        let lastBeepTime = 0;

        function animateScroll() {
          try {
            const elapsed = Date.now() - startTime;
            const progress = Math.min(1, elapsed / duration);
            const easeOut = 1 - Math.pow(1 - progress, 3);
            const currentX = startX + (finalX - startX) * easeOut;

            track.style.transform = `translateX(${currentX}px)`;
            updateReticleSizeToCenterItem();

            const timeBetweenBeeps = 90 + (progress * 420);
            if (Date.now() - lastBeepTime > timeBetweenBeeps && progress < 0.98) {
              playBeep(380 + ((1 - progress) * 320), 'sine', 0.05, 0.035);
              lastBeepTime = Date.now();
            }

            if (progress < 1) {
              requestAnimationFrame(animateScroll);
            } else {
              track.style.transform = `translateX(${finalX}px)`;
              targetElement.classList.add('text-amber-300', 'scale-125', 'drop-shadow-[0_0_25px_rgba(255,215,0,1)]', 'z-10');
              updateReticleSizeToCenterItem();
              
              playBeep(880, 'square', 0.35, 0.15);

              setTimeout(() => {
                executeCameraPanToSky(winningGuest, winnerIndex);
              }, 1200);
            }
          } catch (err) {
            console.error("Animate scroll exception:", err);
            resetDrawState();
          }
        }

        requestAnimationFrame(animateScroll);

      } catch (e) {
        console.error("Draw initiation error:", e);
        resetDrawState();
      }
    }

    function executeCameraPanToSky(winningGuest, winnerIndex) {

        const skyWinner = document.getElementById('sky-winner-container');
        const skyName = document.getElementById('sky-winner-name');

        const canvas = document.getElementById('sky-canvas');
        const w = canvas ? canvas.width : window.innerWidth;
        const h = canvas ? canvas.height : window.innerHeight;

        hugeShootingStar = {
          startTime: performance.now(),
          duration: 1400,
          startX: -300,
          startY: -300,
          endX: w + 400,
          endY: h + 400,
          hasTriggeredReveal: false,
          onRevealTrigger: function() {

            recordWinner(winningGuest.name, winningGuest.ticket);

            resetDrawState();

        renderWinnerHistory();
        renderSky();

        document.body.addEventListener('click', () => {
          initAudioContext();
        }, { once: true });

      } catch (err) {
        console.error("Initialization failed:", err);
      }
    };
  </script>
</body>
